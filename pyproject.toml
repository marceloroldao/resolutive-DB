[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resolutive-db"
version = "1.2.0rc4"
description = "Resolutive Database Engine (BDR) v1.2 RC4 with durable logical clear and legacy BDW4 recovery compatibility"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Marcelo Roldão Matos" }
]
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["bdr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
