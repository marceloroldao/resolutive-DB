name: v42 corruption validation
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O2 -std=c++20 benchmarks/bdr_v42_format_fuzz.cpp -o bdr_v42 -lz
      - name: Run corruption validation
        run: |
          mkdir -p benchmark-results/v42
          ./bdr_v42 | tee benchmark-results/v42/corruption.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v42-corruption-results
          path: benchmark-results/v42/corruption.csv
