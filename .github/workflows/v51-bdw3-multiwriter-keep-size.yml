name: v51 BDW3 KEEP_SIZE multiwriter
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
    paths:
      - 'benchmarks/bdr_v51_bdw3_multiwriter_keep_size.cpp'
      - '.github/workflows/v51-bdw3-multiwriter-keep-size.yml'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++20 benchmarks/bdr_v51_bdw3_multiwriter_keep_size.cpp -o bdr_v51 -lz -lpthread
      - name: Run multiwriter benchmark
        run: |
          mkdir -p benchmark-results/v51
          ./bdr_v51 100000 512 | tee benchmark-results/v51/results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v51-bdw3-multiwriter-keep-size-results
          path: benchmark-results/v51/results.csv
