name: v37 format header validation
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  header:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O3 -std=c++20 benchmarks/bdr_v37_format_header.cpp -o bdr_v37 -lz
      - run: |
          mkdir -p benchmark-results/v37
          ./bdr_v37 | tee benchmark-results/v37/header.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v37-format-header-results
          path: benchmark-results/v37/
