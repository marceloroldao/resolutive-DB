name: V105 Concurrency

on:
  push:
    branches:
      - develop/v1.1.0
  pull_request:
    paths:
      - 'experimental/api_v105/**'
      - 'experimental/api_v104/**'
      - 'experimental/api_v103/**'
      - 'experimental/api_v102/**'
      - 'experimental/api_v101/**'
      - '.github/workflows/v105-concurrency.yml'

jobs:
  concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev
      - name: Configure
        run: cmake -S experimental/api_v105 -B build-v105 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-v105 -j2
      - name: Test total ordering and reopen
        run: ctest --test-dir build-v105 --output-on-failure
