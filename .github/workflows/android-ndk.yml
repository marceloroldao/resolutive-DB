name: Android NDK C ABI

on:
  pull_request:
    branches:
      - main
    paths:
      - "experimental/api_v86/**"
      - ".github/workflows/android-ndk.yml"
  workflow_dispatch:

jobs:
  host-atomic-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev
      - name: Configure host build
        run: cmake -S . -B build/host-atomic -DCMAKE_BUILD_TYPE=Release
      - name: Build atomic C ABI recovery tests
        run: >-
          cmake --build build/host-atomic
          --target v1_atomic_c_api_restart v1_atomic_c_api_torn_tail
          --config Release -j2
      - name: Run atomic C ABI recovery tests
        run: ctest --test-dir build/host-atomic --output-on-failure -R '^v1_atomic_c_api_(restart|torn_tail)$'

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure arm64-v8a
        run: >-
          cmake -S . -B build/android-arm64
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
      - name: Build BDR C ABIs
        run: cmake --build build/android-arm64 --target bdr_c_api bdr_atomic_c_api --config Release -j2
      - name: Verify arm64 archives
        run: |
          test -f build/android-arm64/experimental/api_v86/libbdr_c_api.a
          test -f build/android-arm64/experimental/api_v86/libbdr_atomic_c_api.a
      - name: Verify exported basic C symbols
        run: |
          NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -g --defined-only build/android-arm64/experimental/api_v86/libbdr_c_api.a | tee symbols-basic.txt
          grep -q "bdr_c_open" symbols-basic.txt
          grep -q "bdr_c_put" symbols-basic.txt
          grep -q "bdr_c_get" symbols-basic.txt
          grep -q "bdr_c_delete" symbols-basic.txt
          grep -q "bdr_c_sync" symbols-basic.txt
          grep -q "bdr_c_checkpoint" symbols-basic.txt
          grep -q "bdr_c_close" symbols-basic.txt
      - name: Verify exported atomic C symbols
        run: |
          NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -g --defined-only build/android-arm64/experimental/api_v86/libbdr_atomic_c_api.a | tee symbols-atomic.txt
          grep -q "bdr_atomic_c_abi_version" symbols-atomic.txt
          grep -q "bdr_atomic_c_open" symbols-atomic.txt
          grep -q "bdr_atomic_c_write_batch" symbols-atomic.txt
          grep -q "bdr_atomic_c_get" symbols-atomic.txt
          grep -q "bdr_atomic_c_exists" symbols-atomic.txt
          grep -q "bdr_atomic_c_sync" symbols-atomic.txt
          grep -q "bdr_atomic_c_integrity_check" symbols-atomic.txt
          grep -q "bdr_atomic_c_close" symbols-atomic.txt
      - name: Upload Android arm64-v8a archives
        uses: actions/upload-artifact@v4
        with:
          name: bdr-android-arm64-v8a
          path: |
            build/android-arm64/experimental/api_v86/libbdr_c_api.a
            build/android-arm64/experimental/api_v86/libbdr_atomic_c_api.a
            experimental/api_v86/include/bdr/c_api.h
            experimental/api_v86/include/bdr/atomic_c_api.h
