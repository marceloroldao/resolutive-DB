name: v25 preallocated WAL market
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  market-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev liblmdb-dev libleveldb-dev librocksdb-dev
      - run: g++ -O3 -std=c++20 benchmarks/bdr_v25_prealloc_market.cpp -o bdr_v25 -lsqlite3 -llmdb -lleveldb -lrocksdb -lpthread -ldl -lz -lbz2 -llz4 -lzstd -lsnappy
      - run: |
          mkdir -p benchmark-results/v25
          for rep in 1 2 3; do ./bdr_v25 10000 > benchmark-results/v25/run_${rep}.csv; done
          ./bdr_v25 50000 > benchmark-results/v25/run_50k.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v25-prealloc-market-results
          path: benchmark-results/v25/
