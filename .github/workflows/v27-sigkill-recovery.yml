name: v27 SIGKILL recovery
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  crash-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O3 -std=c++20 benchmarks/bdr_v27_sigkill_recovery.cpp -o bdr_v27 -lz
      - run: |
          mkdir -p benchmark-results/v27
          ./bdr_v27 > benchmark-results/v27/sigkill.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v27-sigkill-results
          path: benchmark-results/v27/
