name: v43 repeated reopen soak
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  soak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O2 -std=c++20 benchmarks/bdr_v43_soak_reopen.cpp -o bdr_v43 -lz
      - name: Run soak
        run: |
          mkdir -p benchmark-results/v43
          ./bdr_v43 | tee benchmark-results/v43/soak.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v43-soak-results
          path: benchmark-results/v43/soak.csv
