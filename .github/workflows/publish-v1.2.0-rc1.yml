name: Publish v1.2.0-rc1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2.0-rc1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen target
        shell: bash
        run: |
          set -euo pipefail
          TARGET="eb77ad7286f234243ca1ed1a2af2d55df8c12238"
          git cat-file -e "${TARGET}^{commit}"
          test "$(git show "${TARGET}:pyproject.toml" | grep -F 'version = "1.2.0rc1"' | wc -l)" -eq 1

      - name: Create tag and GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.2.0-rc1"
          TARGET="eb77ad7286f234243ca1ed1a2af2d55df8c12238"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to move it."
          else
            git tag -a "${TAG}" "${TARGET}" -m "Resolutive DB v1.2.0-rc1"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Resolutive DB v1.2.0-rc1" \
              --notes-file RELEASE_NOTES_v1.2.0-rc1.md \
              --prerelease \
              --verify-tag
          fi

      - name: Verify publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.2.0-rc1 --repo "${GITHUB_REPOSITORY}" --json tagName,isPrerelease,isDraft,targetCommitish,url
