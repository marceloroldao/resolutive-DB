name: V94 Installable Native Package

on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
    paths:
      - 'experimental/api_v86/**'
      - 'experimental/api_v87/**'
      - 'experimental/api_v94/**'
      - '.github/workflows/v94-install-package.yml'
  workflow_dispatch:

jobs:
  install-and-consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zlib1g-dev
      - name: Configure and build package
        run: |
          cmake -S experimental/api_v94 -B build/v94 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/stage
          cmake --build build/v94 -j2
          cmake --install build/v94
      - name: Inspect install tree
        run: |
          find stage -maxdepth 5 -type f -o -type l | sort
          test -f stage/include/bdr/database.hpp
          test -f stage/include/bdr/bdr_c.h
          test -f stage/lib/cmake/bdr/bdrConfig.cmake
          test -f stage/lib/cmake/bdr/bdrTargets.cmake
          test -e stage/lib/libbdr_c.so.1
      - name: Build external C++ consumer with find_package
        run: |
          cmake -S experimental/api_v94/consumer -B build/consumer -DCMAKE_PREFIX_PATH=$PWD/stage
          cmake --build build/consumer -j2
          ./build/consumer/v94_consumer
      - name: Compile external C consumer against installed ABI
        run: |
          cc -std=c11 -O2 experimental/api_v93/quickstart_c.c \
            -I$PWD/stage/include -L$PWD/stage/lib -lbdr_c \
            -Wl,-rpath,$PWD/stage/lib -o build/v94_c_consumer
          ./build/v94_c_consumer
