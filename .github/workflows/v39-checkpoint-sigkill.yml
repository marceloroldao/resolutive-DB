name: v39 checkpoint SIGKILL
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
    paths:
      - 'benchmarks/bdr_v39_checkpoint_sigkill.cpp'
      - 'benchmarks/bdr_v38_checkpoint_bdr3.cpp'
      - '.github/workflows/v39-checkpoint-sigkill.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O3 -std=c++20 benchmarks/bdr_v39_checkpoint_sigkill.cpp -o bdr_v39 -lz
      - name: Run SIGKILL phase validation
        run: |
          mkdir -p benchmark-results/v39
          ./bdr_v39 | tee benchmark-results/v39/checkpoint_sigkill.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v39-checkpoint-sigkill-results
          path: benchmark-results/v39/checkpoint_sigkill.csv
