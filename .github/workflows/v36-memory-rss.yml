name: v36 memory rss
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  rss:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev liblmdb-dev libleveldb-dev librocksdb-dev libsnappy-dev libbz2-dev liblz4-dev libzstd-dev
      - run: g++ -O3 -std=c++20 benchmarks/bdr_v36_memory_engine.cpp -o bdr_v36 -lsqlite3 -llmdb -lleveldb -lrocksdb -lpthread -ldl -lz -lbz2 -llz4 -lzstd -lsnappy
      - run: |
          mkdir -p benchmark-results/v36
          echo "engine,max_rss_kb" > benchmark-results/v36/rss.csv
          for e in bdr sqlite lmdb leveldb rocksdb; do
            /usr/bin/time -f "$e,%M" -o benchmark-results/v36/${e}.rss ./bdr_v36 "$e" 1000000 8 128 > benchmark-results/v36/${e}.out
            cat benchmark-results/v36/${e}.rss >> benchmark-results/v36/rss.csv
          done
          cat benchmark-results/v36/rss.csv
          cat benchmark-results/v36/*.out
      - uses: actions/upload-artifact@v4
        with:
          name: v36-memory-rss-results
          path: benchmark-results/v36/
