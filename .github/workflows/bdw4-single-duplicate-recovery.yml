name: BDW4 single adjacent duplicate recovery

on:
  push:
    branches: [fix/bdw4-single-adjacent-duplicate-recovery]
    paths:
      - 'experimental/api_v101/atomic_wal.cpp'
      - 'experimental/api_v86/CMakeLists.txt'
      - 'experimental/api_v86/test_atomic_single_duplicate_recovery.cpp'
      - 'experimental/api_v86/test_atomic_c_api_single_duplicate_recovery.cpp'
      - '.github/workflows/bdw4-single-duplicate-recovery.yml'
  pull_request:
    paths:
      - 'experimental/api_v101/atomic_wal.cpp'
      - 'experimental/api_v86/CMakeLists.txt'
      - 'experimental/api_v86/test_atomic_single_duplicate_recovery.cpp'
      - 'experimental/api_v86/test_atomic_c_api_single_duplicate_recovery.cpp'
      - '.github/workflows/bdw4-single-duplicate-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev

      - name: Configure
        run: cmake -S experimental/api_v86 -B build-single-duplicate -DCMAKE_BUILD_TYPE=Release

      - name: Build recovery and baseline targets
        run: |
          cmake --build build-single-duplicate --parallel 2 --target             v1_atomic_single_duplicate_recovery             v1_atomic_c_api_single_duplicate_recovery             v1_atomic_c_api_restart             v1_atomic_c_api_torn_tail             v120_atomic_diagnostics

      - name: Reproduce exact production shape and rejection bounds
        run: ./build-single-duplicate/v1_atomic_single_duplicate_recovery

      - name: Cold reopen, append 33790, reopen again
        run: ./build-single-duplicate/v1_atomic_c_api_single_duplicate_recovery

      - name: Preserve normal C ABI restart
        run: ./build-single-duplicate/v1_atomic_c_api_restart

      - name: Preserve torn-tail recovery
        run: ./build-single-duplicate/v1_atomic_c_api_torn_tail

      - name: Preserve diagnostics
        run: ./build-single-duplicate/v120_atomic_diagnostics
