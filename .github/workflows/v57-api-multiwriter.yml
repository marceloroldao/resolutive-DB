name: v57 API multiwriter
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
    paths:
      - 'experimental/api_v56/**'
      - '.github/workflows/v57-api-multiwriter.yml'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          g++ -O3 -std=c++20 \
            -Iexperimental/api_v56/include \
            experimental/api_v56/src/resolutive_index.cpp \
            experimental/api_v56/src/database.cpp \
            experimental/api_v56/tests/benchmark_multiwriter.cpp \
            -o bdr_v57 -lz -lpthread
      - name: Run
        run: |
          mkdir -p benchmark-results/v57
          ./bdr_v57 100000 | tee benchmark-results/v57/results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v57-api-multiwriter-results
          path: benchmark-results/v57/results.csv
