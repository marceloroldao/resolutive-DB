name: v44 malformed bounds
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -O2 -std=c++20 benchmarks/bdr_v44_malformed_bounds.cpp -o bdr_v44 -lz
      - name: Run malformed bounds validation
        run: |
          mkdir -p benchmark-results/v44
          ./bdr_v44 | tee benchmark-results/v44/bounds.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v44-malformed-bounds-results
          path: benchmark-results/v44/bounds.csv
