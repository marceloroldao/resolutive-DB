name: V1 Internal Candidate Gate

on:
  push:
    branches: [ internal/v1-candidate ]
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate, fallback]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev

      - name: Generate streaming database translation unit
        run: python3 experimental/v03_scale/generate_streaming_database.py

      - name: Select backend
        id: cfg
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = "candidate" ]; then
            echo 'extra=-DBDR_EXPERIMENTAL_COMPACT_INDEX' >> "$GITHUB_OUTPUT"
            echo 'index_src=' >> "$GITHUB_OUTPUT"
            echo 'label=v1-candidate-compact-streaming' >> "$GITHUB_OUTPUT"
          else
            echo 'extra=' >> "$GITHUB_OUTPUT"
            echo 'index_src=experimental/api_v86/src/resolutive_index.cpp' >> "$GITHUB_OUTPUT"
            echo 'label=v1-fallback-baseline-streaming' >> "$GITHUB_OUTPUT"
          fi

      - name: Build crash-boundary gate
        run: |
          g++ -std=c++17 -O2 -pthread ${{ steps.cfg.outputs.extra }} \
            -Iexperimental/api_v86/include \
            -Iexperimental/v03_scale \
            experimental/v03_scale/checkpoint_crash_boundary_gate.cpp \
            experimental/v03_scale/database_streaming_selectable.cpp \
            ${{ steps.cfg.outputs.index_src }} -lz -o v1_checkpoint_crash

      - name: Run crash-boundary gate
        env:
          BDR_BACKEND_LABEL: ${{ steps.cfg.outputs.label }}
        run: ./v1_checkpoint_crash | tee v1_checkpoint_crash_${{ matrix.mode }}.log

      - name: Build lifecycle benchmark
        run: |
          g++ -std=c++17 -O2 -pthread ${{ steps.cfg.outputs.extra }} \
            -Iexperimental/api_v86/include \
            -Iexperimental/v03_scale \
            experimental/v03_scale/database_backend_resource.cpp \
            experimental/v03_scale/database_streaming_selectable.cpp \
            ${{ steps.cfg.outputs.index_src }} -lz -o v1_resource

      - name: Run 1M lifecycle smoke
        env:
          BDR_BACKEND_LABEL: ${{ steps.cfg.outputs.label }}
          BDR_RESOURCE_RECORDS: 1000000
        run: /usr/bin/time -v ./v1_resource 2>&1 | tee v1_resource_${{ matrix.mode }}.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-internal-${{ matrix.mode }}
          path: |
            v1_checkpoint_crash_${{ matrix.mode }}.log
            v1_resource_${{ matrix.mode }}.log
          if-no-files-found: error
