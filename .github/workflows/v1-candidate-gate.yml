name: V1 Internal Candidate Gate

on:
  push:
    branches: [ internal/v1-candidate ]
  workflow_dispatch:

jobs:
  api-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen public API header
        shell: bash
        run: |
          expected=$(awk '{print $1}' .github/v1-public-api.lock)
          path=$(awk '{print $2}' .github/v1-public-api.lock)
          actual=$(git hash-object "$path")
          echo "public_api_path=$path"
          echo "expected_blob=$expected"
          echo "actual_blob=$actual"
          test "$actual" = "$expected"

  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake zlib1g-dev
      - name: Configure and build candidate package
        run: |
          cmake -S experimental/api_v86 -B build/package -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix"
          cmake --build build/package --parallel --target bdr_v1_candidate
          cmake --install build/package
      - name: Configure clean external consumer
        run: |
          cmake -S experimental/api_v86/package_consumer -B build/consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix"
          cmake --build build/consumer --parallel
      - name: Run installed package consumer
        run: build/consumer/bdr_v1_package_consumer

  cmake-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake zlib1g-dev
      - name: Configure
        run: cmake -S experimental/api_v86 -B build/v1 -DCMAKE_BUILD_TYPE=Release
      - name: Build v1 targets
        run: cmake --build build/v1 --parallel --target v1_candidate_contract v1_fallback_contract
      - name: Run v1 contracts
        run: ctest --test-dir build/v1 --output-on-failure -R '^v1_.*_contract$'

  cross-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake zlib1g-dev
      - name: Configure
        run: cmake -S experimental/api_v86 -B build/v1 -DCMAKE_BUILD_TYPE=Release
      - name: Build compatibility executables
        run: cmake --build build/v1 --parallel --target v1_compat_baseline v1_compat_candidate v1_compat_fallback
      - name: Baseline writes, candidate reads
        run: |
          rm -rf /tmp/bdr-v1-compat-a
          build/v1/v1_compat_baseline write /tmp/bdr-v1-compat-a
          build/v1/v1_compat_candidate verify /tmp/bdr-v1-compat-a
      - name: Candidate writes, baseline reads
        run: |
          rm -rf /tmp/bdr-v1-compat-b
          build/v1/v1_compat_candidate write /tmp/bdr-v1-compat-b
          build/v1/v1_compat_baseline verify /tmp/bdr-v1-compat-b
      - name: Fallback writes, candidate reads
        run: |
          rm -rf /tmp/bdr-v1-compat-c
          build/v1/v1_compat_fallback write /tmp/bdr-v1-compat-c
          build/v1/v1_compat_candidate verify /tmp/bdr-v1-compat-c
      - name: Candidate writes, fallback reads
        run: |
          rm -rf /tmp/bdr-v1-compat-d
          build/v1/v1_compat_candidate write /tmp/bdr-v1-compat-d
          build/v1/v1_compat_fallback verify /tmp/bdr-v1-compat-d

  checkpoint-churn:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate, fallback]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev
      - name: Select backend
        id: churncfg
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = "candidate" ]; then
            echo 'extra=' >> "$GITHUB_OUTPUT"
            echo 'index_src=' >> "$GITHUB_OUTPUT"
          else
            echo 'extra=-DBDR_V1_FALLBACK_INDEX' >> "$GITHUB_OUTPUT"
            echo 'index_src=experimental/api_v86/src/resolutive_index.cpp' >> "$GITHUB_OUTPUT"
          fi
      - name: Build checkpoint churn gate
        run: |
          g++ -std=c++17 -O2 -pthread ${{ steps.churncfg.outputs.extra }} \
            -Iexperimental/api_v86/include \
            experimental/api_v86/test_v1_checkpoint_churn.cpp \
            experimental/api_v86/src/database_v1.cpp \
            ${{ steps.churncfg.outputs.index_src }} -lz -o v1_checkpoint_churn
      - name: Run 200-cycle checkpoint churn
        env:
          BDR_V1_CHURN_CYCLES: "200"
          BDR_V1_CHURN_OPS_PER_CYCLE: "10000"
          BDR_V1_CHURN_KEY_SPACE: "50000"
        run: /usr/bin/time -v ./v1_checkpoint_churn 2>&1 | tee v1_checkpoint_churn_${{ matrix.mode }}.log
      - name: Upload churn evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-checkpoint-churn-${{ matrix.mode }}
          path: v1_checkpoint_churn_${{ matrix.mode }}.log
          if-no-files-found: error

  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate, fallback]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev
      - name: Select backend
        id: cfg
        shell: bash
        run: |
          if [ "${{ matrix.mode }}" = "candidate" ]; then
            echo 'extra=' >> "$GITHUB_OUTPUT"
            echo 'index_src=' >> "$GITHUB_OUTPUT"
            echo 'label=v1-candidate-compact-streaming' >> "$GITHUB_OUTPUT"
          else
            echo 'extra=-DBDR_V1_FALLBACK_INDEX' >> "$GITHUB_OUTPUT"
            echo 'index_src=experimental/api_v86/src/resolutive_index.cpp' >> "$GITHUB_OUTPUT"
            echo 'label=v1-fallback-baseline-streaming' >> "$GITHUB_OUTPUT"
          fi
      - name: Build crash-boundary gate
        run: |
          g++ -std=c++17 -O2 -pthread ${{ steps.cfg.outputs.extra }} \
            -Iexperimental/api_v86/include \
            -Iexperimental/v03_scale \
            experimental/v03_scale/checkpoint_crash_boundary_gate.cpp \
            experimental/api_v86/src/database_v1.cpp \
            ${{ steps.cfg.outputs.index_src }} -lz -o v1_checkpoint_crash
      - name: Run crash-boundary gate
        env:
          BDR_BACKEND_LABEL: ${{ steps.cfg.outputs.label }}
        run: ./v1_checkpoint_crash | tee v1_checkpoint_crash_${{ matrix.mode }}.log
      - name: Build lifecycle benchmark
        run: |
          g++ -std=c++17 -O2 -pthread ${{ steps.cfg.outputs.extra }} \
            -Iexperimental/api_v86/include \
            -Iexperimental/v03_scale \
            experimental/v03_scale/database_backend_resource.cpp \
            experimental/api_v86/src/database_v1.cpp \
            ${{ steps.cfg.outputs.index_src }} -lz -o v1_resource
      - name: Run 1M lifecycle smoke
        env:
          BDR_BACKEND_LABEL: ${{ steps.cfg.outputs.label }}
          BDR_RESOURCE_RECORDS: 1000000
        run: /usr/bin/time -v ./v1_resource 2>&1 | tee v1_resource_${{ matrix.mode }}.log
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-internal-${{ matrix.mode }}
          path: |
            v1_checkpoint_crash_${{ matrix.mode }}.log
            v1_resource_${{ matrix.mode }}.log
          if-no-files-found: error

  v1-soak:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[v1-soak]')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev
      - name: Build materialized v1 scale gate
        run: |
          g++ -std=c++17 -O2 -pthread \
            -Iexperimental/api_v86/include \
            experimental/v03_scale/scale_gate.cpp \
            experimental/api_v86/src/database_v1.cpp \
            -lz -o v1_scale_gate
      - name: Run 50M materialized v1 soak
        env:
          BDR_SCALE_OPS: "50000000"
          BDR_SCALE_CYCLE_OPS: "10000"
          BDR_SCALE_KEY_SPACE: "100000"
          BDR_SCALE_CHECKPOINT_EVERY_CYCLES: "10"
        run: /usr/bin/time -v ./v1_scale_gate 2>&1 | tee v1_scale_gate_50m.log
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-materialized-50m-soak
          path: v1_scale_gate_50m.log
          if-no-files-found: error
