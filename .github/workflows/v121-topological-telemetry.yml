name: V121 Topological Reload Telemetry

on:
  push:
    branches:
      - experiment/v1.2-topological-telemetry
  pull_request:

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev

      - name: Configure
        run: cmake -S experimental/api_v86 -B build-v121 -DCMAKE_BUILD_TYPE=Release

      - name: Build diagnostic and regression targets
        run: cmake --build build-v121 --target v120_atomic_diagnostics v1_candidate_contract v111_public_compat v1_atomic_c_api_restart v1_atomic_c_api_torn_tail -j2

      - name: Run telemetry regression
        run: ./build-v121/v120_atomic_diagnostics

      - name: Run preserved atomic/restart gates
        run: |
          ./build-v121/v1_candidate_contract
          ./build-v121/v111_public_compat
          ./build-v121/v1_atomic_c_api_restart
          ./build-v121/v1_atomic_c_api_torn_tail
