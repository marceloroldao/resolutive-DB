name: v24 preallocated WAL
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  wal-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O3 -std=c++20 benchmarks/bdr_v24_preallocated_wal.cpp -o bdr_v24 -lz
      - run: |
          mkdir -p benchmark-results/v24
          for rep in 1 2 3; do ./bdr_v24 20000 > benchmark-results/v24/run_${rep}.csv; done
          ./bdr_v24 100000 > benchmark-results/v24/run_100k.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v24-preallocated-wal-results
          path: benchmark-results/v24/
