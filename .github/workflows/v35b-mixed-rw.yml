name: v35b mixed read write
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libleveldb-dev librocksdb-dev libsnappy-dev libbz2-dev liblz4-dev libzstd-dev
      - run: g++ -O3 -std=c++20 benchmarks/bdr_v35b_mixed_rw.cpp -o bdr_v35b -lleveldb -lrocksdb -lpthread -ldl -lz -lbz2 -llz4 -lzstd -lsnappy
      - run: |
          mkdir -p benchmark-results/v35b
          ./bdr_v35b 500000 200000 8 | tee benchmark-results/v35b/mixed.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v35b-mixed-results
          path: benchmark-results/v35b/
