name: V103 Commit Boundary

on:
  push:
    branches:
      - develop/v1.1.0
  pull_request:
    paths:
      - 'experimental/api_v103/**'
      - 'experimental/api_v102/**'
      - 'experimental/api_v101/**'
      - '.github/workflows/v103-commit-boundary.yml'

jobs:
  commit-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev
      - name: Configure
        run: cmake -S experimental/api_v103 -B build-v103 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-v103 -j2
      - name: Test durability and ACK boundary
        run: ctest --test-dir build-v103 --output-on-failure
