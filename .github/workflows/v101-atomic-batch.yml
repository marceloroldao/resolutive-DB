name: V101 Atomic Batch

on:
  push:
    branches:
      - develop/v1.1.0
  pull_request:
    paths:
      - 'experimental/api_v101/**'
      - 'docs/V1_1_ATOMIC_BATCH_DESIGN.md'
      - '.github/workflows/v101-atomic-batch.yml'

jobs:
  atomic-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev
      - name: Configure
        run: cmake -S experimental/api_v101 -B build-v101 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-v101 -j2
      - name: Test atomic WAL recovery
        run: ctest --test-dir build-v101 --output-on-failure
