name: v68 checkpoint disk hygiene
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
    paths:
      - 'experimental/api_v56/**'
      - 'experimental/api_v62/**'
      - 'experimental/api_v68/**'
      - '.github/workflows/v68-disk-hygiene.yml'
  workflow_dispatch:

jobs:
  disk-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure shared C ABI
        run: cmake -S experimental/api_v62 -B experimental/api_v62/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native library
        run: cmake --build experimental/api_v62/build -j2
      - name: Install Python binding
        run: python3 -m pip install ./experimental/api_v62/python
      - name: Run V68 disk hygiene test
        env:
          BDR_C_LIBRARY: ${{ github.workspace }}/experimental/api_v62/build/libbdr_c.so
        run: |
          mkdir -p benchmark-results/v68
          python3 experimental/api_v68/disk_hygiene.py \
            --cycles 50 \
            --puts-per-cycle 200 \
            --seed 680042 \
            --output benchmark-results/v68/results.csv \
            | tee benchmark-results/v68/stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v68-disk-hygiene-results
          path: benchmark-results/v68/
