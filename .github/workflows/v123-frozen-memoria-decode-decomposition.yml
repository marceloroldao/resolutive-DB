name: V123 Frozen Memoria Decode Decomposition

on:
  push:
    branches:
      - experiment/v1.2-topological-telemetry
  pull_request:
  workflow_dispatch:

jobs:
  frozen-memoria-decode-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Resolutive-DB experiment
        uses: actions/checkout@v4

      - name: Checkout validated Memoria.ia benchmark head
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/memoria.ia
          ref: 99a1585d497b98f0fc6f360ec8f39e6771452827
          path: memoria-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e './memoria-source[product,test]'

      - name: Build shared atomic ABI
        run: |
          cmake -S experimental/api_v86 -B build-v123 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-v123 --target bdr_atomic_c_api_shared -j2

      - name: Validate bulk-get bridge before decomposition
        env:
          BDR_ATOMIC_LIBRARY: ${{ github.workspace }}/build-v123/libbdr_atomic_c_api.so
        run: python -m pytest -q tests/test_atomic_bridge.py

      - name: Run frozen Memoria decode decomposition
        env:
          BDR_ATOMIC_LIBRARY: ${{ github.workspace }}/build-v123/libbdr_atomic_c_api.so
        run: |
          python benchmarks/v123_frozen_memoria_decode_decomposition.py \
            --library "$BDR_ATOMIC_LIBRARY" \
            | tee v123-frozen-memoria-decode-decomposition.json

      - name: Upload V123 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v123-frozen-memoria-decode-decomposition
          path: v123-frozen-memoria-decode-decomposition.json
