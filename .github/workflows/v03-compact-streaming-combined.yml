name: V0.3 Compact Streaming Combined

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [baseline, compact]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev

      - name: Generate streaming database translation unit
        run: python3 experimental/v03_scale/generate_streaming_database.py

      - name: Build streaming crash gate
        run: |
          EXTRA=""
          INDEX_SRC="experimental/api_v86/src/resolutive_index.cpp"
          if [ "${{ matrix.backend }}" = "compact" ]; then
            EXTRA="-DBDR_EXPERIMENTAL_COMPACT_INDEX"
            INDEX_SRC=""
          fi
          g++ -std=c++17 -O2 -pthread $EXTRA \
            -Iexperimental/api_v86/include \
            -Iexperimental/v03_scale \
            experimental/v03_scale/crash_recovery_gate.cpp \
            experimental/v03_scale/database_streaming_selectable.cpp \
            $INDEX_SRC -lz -o combined_crash

      - name: Run streaming crash gate
        run: ./combined_crash | tee combined_crash_${{ matrix.backend }}.log

      - name: Build streaming concurrency gate
        run: |
          EXTRA=""
          INDEX_SRC="experimental/api_v86/src/resolutive_index.cpp"
          if [ "${{ matrix.backend }}" = "compact" ]; then
            EXTRA="-DBDR_EXPERIMENTAL_COMPACT_INDEX"
            INDEX_SRC=""
          fi
          g++ -std=c++17 -O2 -pthread $EXTRA \
            -Iexperimental/api_v86/include \
            -Iexperimental/v03_scale \
            experimental/v03_scale/concurrency_gate.cpp \
            experimental/v03_scale/database_streaming_selectable.cpp \
            $INDEX_SRC -lz -o combined_concurrency

      - name: Run streaming concurrency gate
        run: ./combined_concurrency | tee combined_concurrency_${{ matrix.backend }}.log

      - name: Build streaming resource benchmark
        run: |
          EXTRA=""
          INDEX_SRC="experimental/api_v86/src/resolutive_index.cpp"
          if [ "${{ matrix.backend }}" = "compact" ]; then
            EXTRA="-DBDR_EXPERIMENTAL_COMPACT_INDEX"
            INDEX_SRC=""
          fi
          g++ -std=c++17 -O2 -pthread $EXTRA \
            -Iexperimental/api_v86/include \
            -Iexperimental/v03_scale \
            experimental/v03_scale/database_backend_resource.cpp \
            experimental/v03_scale/database_streaming_selectable.cpp \
            $INDEX_SRC -lz -o combined_resource

      - name: Measure streaming database at 1M
        env:
          BDR_BACKEND_LABEL: streaming-${{ matrix.backend }}
          BDR_RESOURCE_RECORDS: 1000000
        run: /usr/bin/time -v ./combined_resource 2>&1 | tee combined_resource_${{ matrix.backend }}.log

      - name: Upload combined evidence
        uses: actions/upload-artifact@v4
        with:
          name: combined-${{ matrix.backend }}
          path: |
            combined_crash_${{ matrix.backend }}.log
            combined_concurrency_${{ matrix.backend }}.log
            combined_resource_${{ matrix.backend }}.log
          if-no-files-found: error
