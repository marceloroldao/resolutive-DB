name: V126 Packed Output Probe

on:
  push:
    branches:
      - experiment/v1.2-topological-telemetry
  pull_request:
  workflow_dispatch:

jobs:
  packed-output-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Resolutive-DB experiment
        uses: actions/checkout@v4

      - name: Checkout validated Memoria.ia benchmark head
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/memoria.ia
          ref: 99a1585d497b98f0fc6f360ec8f39e6771452827
          path: memoria-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e './memoria-source[product,test]'

      - name: Build shared atomic ABI
        run: |
          cmake -S experimental/api_v86 -B build-v126 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-v126 --target bdr_atomic_c_api_shared -j2

      - name: Preserve existing bridge regression
        env:
          BDR_ATOMIC_LIBRARY: ${{ github.workspace }}/build-v126/libbdr_atomic_c_api.so
        run: python -m pytest -q tests/test_atomic_bridge.py tests/test_atomic_bridge_packed_keys.py

      - name: Run packed output probe
        env:
          BDR_ATOMIC_LIBRARY: ${{ github.workspace }}/build-v126/libbdr_atomic_c_api.so
        run: |
          python benchmarks/v126_packed_output_probe.py \
            --library "$BDR_ATOMIC_LIBRARY" \
            | tee v126-packed-output-probe.json

      - name: Upload V126 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v126-packed-output-probe
          path: v126-packed-output-probe.json
