name: v29 mpsc group commit
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
  workflow_dispatch:
jobs:
  mpsc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O3 -std=c++20 benchmarks/bdr_v29_mpsc_groupcommit.cpp -o bdr_v29 -lz -lpthread
      - run: |
          mkdir -p benchmark-results/v29
          for rep in 1 2 3; do ./bdr_v29 100000 128 > benchmark-results/v29/run_${rep}.csv; done
          ./bdr_v29 100000 32 > benchmark-results/v29/run_batch32.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v29-mpsc-results
          path: benchmark-results/v29/
