name: v72 Sanitizers
on:
  push:
    branches: [experiment/hierarchical-resolutive-addressing]
    paths:
      - 'experimental/api_v56/**'
      - 'experimental/api_v69/**'
      - 'experimental/api_v70/**'
      - 'experimental/api_v71/**'
      - '.github/workflows/v72-sanitizers.yml'
  workflow_dispatch:

jobs:
  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build ASan
        run: |
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=address -pthread \
            -Iexperimental/api_v56/include \
            experimental/api_v56/src/database.cpp \
            experimental/api_v56/src/resolutive_index.cpp \
            experimental/api_v71/test_same_key_put_delete_race.cpp \
            -lz -o /tmp/bdr_asan
      - name: Run ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
        run: /tmp/bdr_asan

  ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build UBSan
        run: |
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=undefined -fno-sanitize-recover=all -pthread \
            -Iexperimental/api_v56/include \
            experimental/api_v56/src/database.cpp \
            experimental/api_v56/src/resolutive_index.cpp \
            experimental/api_v71/test_same_key_put_delete_race.cpp \
            -lz -o /tmp/bdr_ubsan
      - name: Run UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: /tmp/bdr_ubsan

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build TSan
        run: |
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=thread -pthread \
            -Iexperimental/api_v56/include \
            experimental/api_v56/src/database.cpp \
            experimental/api_v56/src/resolutive_index.cpp \
            experimental/api_v69/test_close_submit_race.cpp \
            -lz -o /tmp/bdr_tsan_close
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=thread -pthread \
            -Iexperimental/api_v56/include \
            experimental/api_v56/src/database.cpp \
            experimental/api_v56/src/resolutive_index.cpp \
            experimental/api_v70/test_checkpoint_writer_race.cpp \
            -lz -o /tmp/bdr_tsan_checkpoint
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=thread -pthread \
            -Iexperimental/api_v56/include \
            experimental/api_v56/src/database.cpp \
            experimental/api_v56/src/resolutive_index.cpp \
            experimental/api_v71/test_same_key_put_delete_race.cpp \
            -lz -o /tmp/bdr_tsan_same_key
      - name: Run TSan close-submit
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: /tmp/bdr_tsan_close
      - name: Run TSan checkpoint-writers
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: /tmp/bdr_tsan_checkpoint
      - name: Run TSan same-key
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: /tmp/bdr_tsan_same_key
